version: "3"
services:
  collector:
    build: ./collector
    volumes:
      - data:/data
    environment:
      - PING_TARGET=8.8.8.8
      - PING_INTERVAL=30
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "8080:5000"
    volumes:
      - data:/data
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}   # 從 .env 讀取
    restart: unless-stopped

volumes:
  data: